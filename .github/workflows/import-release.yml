name: Import verified CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cli-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: Package v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build verified immutable archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          spec="release-specs/v${VERSION#v}.json"
          ./scripts/package_release.sh "$spec"

      - name: Build native Linux packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          spec="release-specs/v${VERSION#v}.json"
          ./scripts/package_linux_packages.sh "$spec" dist dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          existing_release_id="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1)"
          if [[ -n "$existing_release_id" ]]; then
            echo "Release $tag already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/showpass-*.tar.gz \
            dist/showpass_*.deb \
            dist/showpass-*.rpm \
            dist/SHA256SUMS \
            dist/LINUX_PACKAGES_SHA256SUMS \
            dist/SOURCE_SHA256SUMS \
            dist/manifest.json \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Showpass CLI $tag" \
            --notes-file dist/RELEASE_NOTES.md

          release_id="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft) | .id" | head -n1)"
          if [[ -z "$release_id" ]]; then
            echo "Could not find the newly created draft release $tag" >&2
            exit 1
          fi

          for asset in \
            dist/showpass-*.tar.gz \
            dist/showpass_*.deb \
            dist/showpass-*.rpm \
            dist/SHA256SUMS \
            dist/LINUX_PACKAGES_SHA256SUMS \
            dist/SOURCE_SHA256SUMS \
            dist/manifest.json; do
            name="$(basename "$asset")"
            local_size="$(wc -c < "$asset" | tr -d ' ')"
            local_sha256="$(sha256sum "$asset" | awk '{print $1}')"
            remote_asset="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/$release_id" \
              --jq ".assets[] | select(.name == \"$name\") | {size, digest}")"
            remote_size="$(jq -er '.size' <<< "$remote_asset")"
            remote_digest="$(jq -r '.digest // empty' <<< "$remote_asset")"

            if [[ "$remote_size" != "$local_size" ]]; then
              echo "Uploaded size mismatch for $name" >&2
              exit 1
            fi
            if [[ -n "$remote_digest" && "$remote_digest" != "sha256:$local_sha256" ]]; then
              echo "Uploaded digest mismatch for $name" >&2
              exit 1
            fi
          done

          gh api \
            --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -f draft=false >/dev/null
